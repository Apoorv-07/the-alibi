# Two services, because the privacy story is only real if the local-model path can run *next to* the app with
# no cloud: `alibi` needs no LLM at all (rules + deterministic simulator + CP-SAT), and `ollama` is optional
# (LM Studio running on the host is the other local path — see the environment block below). Start the LLM
# with `docker compose --profile llm up` when you have a GPU.
services:
  alibi:
    build: .
    ports: ["8000:8000"]
    # LM Studio listens on the host, so the container reaches it through host-gateway below. Note that
    # "local" for this app's privacy decision means *loopback inside the container*, so a host runtime is
    # treated as remote (redacted + metered) unless you also set `network_mode: host`, in which case
    # 127.0.0.1:1234 genuinely is the container's own loopback. Either is defensible; the difference is
    # printed by `GET /api/health` (`components.ai.loopback`) rather than hidden.
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      ALIBI_DB: /data/alibi.db
      ALIBI_MODE: ${ALIBI_MODE:-demo}
      # The names the code actually reads. `OLLAMA_URL` here would be a comment wearing a setting.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
      ALIBI_RAW_RETENTION_DAYS: ${ALIBI_RAW_RETENTION_DAYS:-30}
      ALIBI_UPLOAD_DIR: ${ALIBI_UPLOAD_DIR:-/data/uploads}
      ALIBI_INSTITUTION_CONFIG: ${ALIBI_INSTITUTION_CONFIG:-}
    volumes:
      - alibi-data:/data
    # The healthcheck is /readyz, which is a 503 until a sync has run: a container that is up but has
    # ingested nothing is unhealthy *on purpose*, so "process exists" can never be mistaken for
    # "the ledger has evidence in it".
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u;u.urlopen('http://127.0.0.1:8000/readyz',timeout=2)"]
      interval: 30s
      start_period: 40s
    restart: unless-stopped

  seed:
    build: .
    profiles: ["seed"]
    command: ["python3", "-m", "alibi.cli", "--db", "/data/alibi.db", "sync"]
    volumes: [alibi-data:/data]
    depends_on: [alibi]

  # A nightly retention pass, as a one-shot you can schedule externally:
  #   docker compose run --rm retain
  retain:
    build: .
    profiles: ["retain"]
    command: ["python3", "-m", "alibi.cli", "--db", "/data/alibi.db", "retention"]
    volumes: [alibi-data:/data]

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes: [ollama-models:/root/.ollama]
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      start_period: 30s

volumes:
  alibi-data:
  ollama-models:
